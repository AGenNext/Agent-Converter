# One-command local run. Build the image first with Cloud Native Buildpacks:
#   make image           (or ./scripts/build-image.sh)
# Then:
#   cp .env.example .env  # fill in keys
#   docker compose up
# Open http://localhost:8080 for the control panel.
services:
  research-agent:
    image: research-deep-agent:latest
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
