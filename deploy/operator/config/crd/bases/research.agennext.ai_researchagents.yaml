apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: researchagents.research.agennext.ai
spec:
  group: research.agennext.ai
  names:
    kind: ResearchAgent
    listKind: ResearchAgentList
    plural: researchagents
    singular: researchagent
    shortNames:
      - rag
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Model
          type: string
          jsonPath: .spec.model
        - name: Replicas
          type: integer
          jsonPath: .spec.replicaCount
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: ResearchAgent deploys a Research Deep Agent instance.
          properties:
            spec:
              type: object
              properties:
                replicaCount:
                  type: integer
                  minimum: 1
                  default: 2
                model:
                  type: string
                  description: Model id passed as RESEARCH_AGENT_MODEL.
                  default: "anthropic:claude-sonnet-4-5"
                secretName:
                  type: string
                  description: Secret holding the API keys.
                  default: research-agent-secrets
                image:
                  type: object
                  properties:
                    repository:
                      type: string
                      default: research-deep-agent
                    tag:
                      type: string
                      default: latest
                    pullPolicy:
                      type: string
                      default: IfNotPresent
                service:
                  type: object
                  properties:
                    type:
                      type: string
                      default: ClusterIP
                    port:
                      type: integer
                      default: 80
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                autoscaling:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    minReplicas:
                      type: integer
                      default: 2
                    maxReplicas:
                      type: integer
                      default: 6
                    targetCPUUtilizationPercentage:
                      type: integer
                      default: 70
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
