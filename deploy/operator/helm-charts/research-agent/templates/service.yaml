apiVersion: v1
kind: Service
metadata:
  name: {{ include "research-agent.name" . }}
  labels:
    {{- include "research-agent.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "research-agent.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
