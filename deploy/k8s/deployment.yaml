apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-deep-agent
  labels:
    app.kubernetes.io/name: research-deep-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: research-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: research-deep-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: research-deep-agent
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: research-platform
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: agent
          image: research-deep-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: research-agent-secrets
          # Resource requests are what OpenCost uses to allocate cost, so set
          # them deliberately. Tune to your model and traffic.
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
