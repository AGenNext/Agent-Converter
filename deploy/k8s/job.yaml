# One-off research run as a Kubernetes Job (uses the CLI's QUESTION env var).
# kubectl create -f job.yaml then: kubectl logs job/research-once
apiVersion: batch/v1
kind: Job
metadata:
  name: research-once
  labels:
    app.kubernetes.io/name: research-deep-agent
    app.kubernetes.io/component: job
    app.kubernetes.io/part-of: research-platform
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: research-deep-agent
        app.kubernetes.io/part-of: research-platform
    spec:
      restartPolicy: Never
      containers:
        - name: agent
          image: research-deep-agent:latest
          command: ["python", "main.py"]
          env:
            - name: QUESTION
              value: "Research Parkwalk Advisors for a UK aerospace deep-tech seed round."
          envFrom:
            - secretRef:
                name: research-agent-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
