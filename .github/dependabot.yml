# Keep dependencies and GitHub Actions patched. Grouping minor/patch updates
# keeps PR noise down while surfacing security fixes promptly.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
    groups:
      ui-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
