name: Release (build, SBOM, sign)

# Build the OCI image with Cloud Native Buildpacks, push to GHCR, generate a
# CycloneDX SBOM, and sign both the image and the SBOM with cosign (keyless,
# via GitHub OIDC + Sigstore).
#
# Supply-chain note: third-party tooling is installed inline at pinned versions
# rather than via tag-pinned Actions, so there are no mutable-tag Action refs to
# trust. Only GitHub-owned actions (actions/*) are used via `uses:`. Bump the
# pinned TOOL versions below as needed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # required for cosign keyless signing

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PACK_VERSION: "0.35.1"
  COSIGN_VERSION: "v2.4.1"
  # Optional: pin the pack tarball's sha256 to fully verify the download.
  # Leave empty to skip (cosign is always verified against its checksums file).
  PACK_SHA256: ""

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned tooling (pack, cosign) with verification
        run: |
          set -euo pipefail
          # pack: pinned version; verify sha256 if PACK_SHA256 is set.
          curl -sSfL "https://github.com/buildpacks/pack/releases/download/v${PACK_VERSION}/pack-v${PACK_VERSION}-linux.tgz" -o /tmp/pack.tgz
          if [ -n "${PACK_SHA256}" ]; then
            echo "${PACK_SHA256}  /tmp/pack.tgz" | sha256sum -c -
          fi
          sudo tar -xz -C /usr/local/bin -f /tmp/pack.tgz pack
          # cosign: verify the binary against the release's published checksums.
          base="https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}"
          curl -sSfL "${base}/cosign-linux-amd64" -o /tmp/cosign
          curl -sSfL "${base}/cosign_checksums.txt" -o /tmp/cosign_checksums.txt
          grep ' cosign-linux-amd64$' /tmp/cosign_checksums.txt \
            | sed 's#cosign-linux-amd64#/tmp/cosign#' | sha256sum -c -
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          pack version && cosign version

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        id: build
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-latest}"
          IMAGE_LC="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          pack build "${IMAGE_LC}:${TAG}" \
            --builder paketobuildpacks/builder-jammy-base \
            --default-process web \
            --publish
          # Pin to the immutable digest so the signature covers exact bytes.
          DIGEST="$(docker buildx imagetools inspect "${IMAGE_LC}:${TAG}" --format '{{.Manifest.Digest}}')"
          echo "ref=${IMAGE_LC}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (CycloneDX)
        run: |
          python -m pip install cyclonedx-bom -r requirements.txt
          cyclonedx-py environment -o sbom.cdx.json

      - name: Sign image and attest SBOM (keyless)
        run: |
          set -euo pipefail
          cosign sign --yes "${{ steps.build.outputs.ref }}"
          cosign attest --yes --type cyclonedx \
            --predicate sbom.cdx.json \
            "${{ steps.build.outputs.ref }}"

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json
