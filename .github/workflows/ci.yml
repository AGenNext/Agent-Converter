name: CI

# Lint + tests for the Python app and a JS syntax check for the panel.
# Uses NO `uses:` actions (checkout via git fetch-by-SHA; runner's preinstalled
# python3/node) so it runs under the org Allowed-actions policy that refuses
# actions/*. Trade-off: the Python matrix is dropped — tests run on the runner's
# default python3. Restore actions/setup-python once the org policy allows it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (git fetch by SHA, no actions)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir src && cd src && git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: Lint + test
        working-directory: src
        run: |
          set -euo pipefail
          python3 -m venv /tmp/v
          . /tmp/v/bin/activate
          pip install -q --upgrade pip
          pip install -q -r requirements.txt pyflakes pytest
          python -m pyflakes research_agent server.py mcp_server.py main.py
          pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (git fetch by SHA, no actions)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir src && cd src && git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: Syntax-check panel JavaScript
        working-directory: src
        run: |
          node --check static/a2ui-client.js
          node -e "const fs=require('fs');const h=fs.readFileSync('static/index.html','utf8');const m=[...h.matchAll(/<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/g)].map(x=>x[1]).join('\n');fs.writeFileSync('/tmp/panel.js',m);"
          node --check /tmp/panel.js
