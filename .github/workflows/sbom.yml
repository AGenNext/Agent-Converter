name: SBOM

# Generate a CycloneDX SBOM for the Python app and run pip-audit. Uses NO
# `uses:` actions (checkout via git fetch-by-SHA; venv) so it runs under the
# org Allowed-actions policy. The SBOM is summarised in the log; artifact
# upload needs actions/upload-artifact (restore once the org policy allows it).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (git fetch by SHA, no actions)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir src && cd src && git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: Python SBOM (CycloneDX) + audit
        working-directory: src
        run: |
          set -uo pipefail
          python3 -m venv /tmp/v
          . /tmp/v/bin/activate
          pip install -q --upgrade pip
          pip install -q cyclonedx-bom pip-audit -r requirements.txt
          mkdir -p sbom
          cyclonedx-py environment /tmp/v -o sbom/python.cdx.json
          python -c "import json; d=json.load(open('sbom/python.cdx.json')); print('SBOM:', len(d.get('components',[])), 'components', d.get('bomFormat'), d.get('specVersion'))"
          echo "::group::pip-audit"; pip-audit || true; echo "::endgroup::"
