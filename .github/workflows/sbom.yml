name: SBOM

# Generate CycloneDX SBOMs for the Python app and the UI component library,
# and upload them as build artifacts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.11"

      - name: Python SBOM (CycloneDX)
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom -r requirements.txt
          mkdir -p sbom
          cyclonedx-py environment -o sbom/python.cdx.json

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"

      - name: UI SBOM (CycloneDX)
        run: |
          cd ui
          npm install --package-lock-only
          npm sbom --sbom-format cyclonedx > ../sbom/ui.cdx.json || true

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit || true   # report, do not fail the build on advisory noise

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom/*.json
