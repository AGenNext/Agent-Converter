name: SBOM

# Generate CycloneDX SBOMs for the Python app and the UI component library,
# and upload them as build artifacts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python SBOM (CycloneDX)
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom -r requirements.txt
          mkdir -p sbom
          cyclonedx-py environment -o sbom/python.cdx.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: UI SBOM (CycloneDX)
        run: |
          cd ui
          npm install --package-lock-only
          npm sbom --sbom-format cyclonedx > ../sbom/ui.cdx.json || true

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit || true   # report, do not fail the build on advisory noise

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/*.json
