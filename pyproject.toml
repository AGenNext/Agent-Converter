[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-deep-agent"
version = "1.0.0"
description = "A LangChain deep agent implementation of the Research Agent build spec"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "deepagents>=0.6,<1.0",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-ollama>=0.2",
    "tavily-python>=0.5",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "openfeature-sdk>=0.7",
    "mcp>=1.2",
]

[project.scripts]
research-agent = "main:main"

[tool.setuptools]
packages = ["research_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
